name: Перепрогон 56 на docs

# ПРОМПТ 56, стадии 2–3. Вход — artifacts/ours56_docs.jsonl (склейка всех документов
# поля docs). Схема, протокол, пороги и отбор — ровно те же, что в 52: ничего не
# подгоняется. Порог и конфигурация выбираются только на внутренних фолдах;
# test 301 используется один раз, в самом конце, для замера.
on:
  workflow_dispatch:
  push:
    branches:
      - arena/4a5c459f-smarty-chumkov
    paths:
      - "artifacts/plan56.json"

permissions:
  contents: write

env:
  BRANCH: arena/4a5c459f-smarty-chumkov
  PAIRS: artifacts/ours56_docs.jsonl

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: artifacts
      - name: Проверить план и вход
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, hashlib
          plan = json.load(open("artifacts/plan56.json"))
          assert plan["entry"] == "docs", plan
          assert plan["folds"] == 10, plan
          assert plan["seeds"] == [0, 1, 2, 3, 4], plan
          assert plan["test301"] == "final measurement only", plan
          digest = hashlib.sha256(open("artifacts/ours56_docs.jsonl", "rb").read()).hexdigest()
          assert digest == plan["sha256_docs"], (digest, plan["sha256_docs"])
          print("план принят, sha256 входа верен:", digest)
          PY

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Dataset
            spanver
            tools
            tests
            models/rubert-tiny2
            weights/rubert-tiny2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Проверить вход и тесты
        run: |
          set -euo pipefail
          pip install pytest pyarrow
          # baseline нужен entry56 для сверки меток: пересобираем прежний вход
          python tools/prepare_ours33.py
          test "$(sha256sum artifacts/ours33.jsonl | cut -d' ' -f1)" = "0ba55b91943c149a61ffe9db35a91db2a32deda573d72ba8fb6575f51b027f63"
          # и новый вход: sha256 обязан совпасть с закоммиченным в plan56.json
          python tools/rebuild56.py
          test "$(sha256sum artifacts/ours56_docs.jsonl | cut -d' ' -f1)" = "$(python -c "import json;print(json.load(open('artifacts/plan56.json'))['sha256_docs'])")"
          python tools/entry56.py --pairs artifacts/ours56_docs.jsonl
          python tools/fewshot56.py
          test "$(sha256sum artifacts/fewshot56_examples.json | cut -d' ' -f1)" != ""
          python -m pytest -q tests/test_preflight_13.py

  folds:
    needs: [plan, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - {outer: 1, inner: 2, primary: true}
          - {outer: 1, inner: 3, primary: false}
          - {outer: 1, inner: 4, primary: false}
          - {outer: 1, inner: 5, primary: false}
          - {outer: 2, inner: 3, primary: true}
          - {outer: 2, inner: 4, primary: false}
          - {outer: 2, inner: 5, primary: false}
          - {outer: 2, inner: 6, primary: false}
          - {outer: 3, inner: 4, primary: true}
          - {outer: 3, inner: 5, primary: false}
          - {outer: 3, inner: 6, primary: false}
          - {outer: 3, inner: 7, primary: false}
          - {outer: 4, inner: 5, primary: true}
          - {outer: 4, inner: 6, primary: false}
          - {outer: 4, inner: 7, primary: false}
          - {outer: 4, inner: 8, primary: false}
          - {outer: 5, inner: 6, primary: true}
          - {outer: 5, inner: 7, primary: false}
          - {outer: 5, inner: 8, primary: false}
          - {outer: 5, inner: 9, primary: false}
          - {outer: 6, inner: 7, primary: true}
          - {outer: 6, inner: 8, primary: false}
          - {outer: 6, inner: 9, primary: false}
          - {outer: 6, inner: 10, primary: false}
          - {outer: 7, inner: 8, primary: true}
          - {outer: 7, inner: 9, primary: false}
          - {outer: 7, inner: 10, primary: false}
          - {outer: 7, inner: 1, primary: false}
          - {outer: 8, inner: 9, primary: true}
          - {outer: 8, inner: 10, primary: false}
          - {outer: 8, inner: 1, primary: false}
          - {outer: 8, inner: 2, primary: false}
          - {outer: 9, inner: 10, primary: true}
          - {outer: 9, inner: 1, primary: false}
          - {outer: 9, inner: 2, primary: false}
          - {outer: 9, inner: 3, primary: false}
          - {outer: 10, inner: 1, primary: true}
          - {outer: 10, inner: 2, primary: false}
          - {outer: 10, inner: 3, primary: false}
          - {outer: 10, inner: 4, primary: false}
    env:
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Dataset/1_rushallu_rag_gold
            spanver
            tools
            artifacts
            models/rubert-tiny2
            weights/rubert-tiny2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Данные и веса
        run: |
          set -euo pipefail
          pip install pyarrow
          pip install 'torch==2.15.0' --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers==4.57.6' huggingface_hub
          python tools/entry56.py --pairs "$PAIRS"
          python tools/assemble_weights.py weights/rubert-tiny2 models/rubert-tiny2/pytorch_model.bin
      - name: Обучение (схема 52, вход docs)
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 260m python -u tools/train51_ten.py \
            --variant ten --outer '${{ matrix.outer }}' --inner '${{ matrix.inner }}' \
            --git-sha '${{ github.sha }}' --pairs "$PAIRS" \
            --out-prefix ablation56_ten
      - name: Сохранить отчёт в ветку
        if: always()
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mkdir -p artifacts
          files=$(ls artifacts/ablation56_ten_outer*.json 2>/dev/null || true)
          if [ -n "$files" ]; then
            git add -f $files
            git commit -m "ablation56 outer ${{ matrix.outer }} inner ${{ matrix.inner }} [skip ci]" || echo "нечего коммитить"
            for attempt in 1 2 3; do
              git fetch origin "$BRANCH"
              git rebase FETCH_HEAD && git push origin HEAD:"$BRANCH" && break
              sleep 10
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report56-outer${{ matrix.outer }}-inner${{ matrix.inner }}
          path: artifacts/ablation56_ten_outer${{ matrix.outer }}_inner${{ matrix.inner }}.json
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always() && matrix.primary
        with:
          name: weights56-outer${{ matrix.outer }}
          path: weights/ablation51/ten/fold${{ matrix.outer }}/
          if-no-files-found: warn
          retention-days: 30

  collect:
    if: always() && needs.plan.result == 'success' && needs.smoke.result == 'success'
    needs: [plan, smoke, folds]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Dataset/1_rushallu_rag_gold
            spanver
            tools
            artifacts
            models/rubert-tiny2
            weights/rubert-tiny2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Зависимости и вход
        run: |
          set -euo pipefail
          pip install pyarrow
          pip install 'torch==2.15.0' --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers==4.57.6' huggingface_hub
          python tools/entry56.py --pairs "$PAIRS"
          python tools/assemble_weights.py weights/rubert-tiny2 models/rubert-tiny2/pytorch_model.bin
      - uses: actions/download-artifact@v4
        with:
          pattern: report56-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: weights56-*
          path: weights/ablation51
          merge-multiple: true
      - name: Отбор по внутренним фолдам и метрики
        run: |
          set -euo pipefail
          python tools/collect51_ten.py --variant ten \
            --pairs "$PAIRS" \
            --records-prefix ablation56_ten \
            --summary-out artifacts/ablation56_ten_summary.json
          python tools/decode56.py
      - name: Потолок и скорость на новом входе
        run: |
          set -euo pipefail
          python tools/ceiling52.py --outer 1 --pairs "$PAIRS" --out artifacts/ceiling56.json
          python tools/speed52.py --pairs "$PAIRS" --lengths 838,1000,3980,20000 --seeds 1,3,5 \
            --out artifacts/speed56.json
      - name: Финальный замер на test 301 (только здесь)
        run: |
          set -euo pipefail
          python tools/eval56_test.py --entry docs --out artifacts/eval56_test_docs.json
          python tools/eval56_test.py --entry joined_reference --out artifacts/eval56_test_joined.json
      - name: Сохранить результаты в ветку
        if: always()
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --sparse -f artifacts/ablation56_ten_outer*_inner*.json \
            artifacts/ablation56_ten_summary.json artifacts/decode56.json \
            artifacts/ceiling56.json artifacts/speed56.json \
            artifacts/eval56_test_docs.json artifacts/eval56_test_joined.json 2>/dev/null || true
          git commit -m "Перепрогон 56: результаты на входе docs [skip ci]" || echo "нечего коммитить"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git rebase FETCH_HEAD && git push origin HEAD:"$BRANCH" && break
            sleep 10
          done
