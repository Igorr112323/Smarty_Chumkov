name: Verify promoted final47 ensemble
on:
  push:
    branches: ["arena/5afadcb0-smarty-chumkov"]
    paths: ["artifacts/final47_verify_request.json"]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Dataset/1_rushallu_rag_gold
            spanver
            tools
            artifacts
            models/rubert-tiny2
            weights/rubert-tiny2
            weights/final
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install pyarrow
          pip install 'torch==2.15.0' --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers==4.57.6' huggingface_hub
          python tools/prepare_ours33.py
          python tools/assemble_weights.py weights/rubert-tiny2 models/rubert-tiny2/pytorch_model.bin
      - run: |
          set -o pipefail
          python tools/verify_final47.py
          python tools/finalize47.py
          python tools/final48.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f weights/final/manifest.json artifacts/final47_restore_verification.json artifacts/frozen_final.json artifacts/final_summary.md artifacts/report.json artifacts/decision48.json
          git commit -m 'Verify final47 ensemble and publish honest CV summary'
          git push origin HEAD:${{ github.ref_name }}
