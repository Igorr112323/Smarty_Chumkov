name: Проверка тестов вложенной CV

on:
  push:
    branches:
      - arena/5afadcb0-smarty-chumkov
    paths:
      - .github/workflows/nested37_verify.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            spanver
            tools
            tests
            scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: |
          pip install pytest pyarrow
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers>=4.50,<5' huggingface_hub
      - name: tests without test301
        id: tests
        continue-on-error: true
        shell: bash
        run: python -m pytest -q tests/test_base33_safe.py tests/test_base33_training.py tests/test_preflight_13.py tests/test_sweep_ragtruth30.py tests/test_nested36.py tests/test_nested37.py 2>&1 | tee /tmp/verify37.txt
      - name: save JSON diagnostics
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          source = Path('/tmp/verify37.txt')
          target = Path('artifacts/nested37_verification.json')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps({'status': os.environ['TEST_OUTCOME'], 'tests': source.read_text(encoding='utf-8') if source.exists() else None}, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git fetch origin arena/5afadcb0-smarty-chumkov
          git merge --ff-only origin/arena/5afadcb0-smarty-chumkov
          git add --sparse -f artifacts/nested37_verification.json
          if ! git diff --cached --quiet; then
            git config user.name github-actions
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m 'Сохранить проверку тестов CV [skip ci]'
            git push origin arena/5afadcb0-smarty-chumkov
          fi
      - name: verify tests passed
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: test "$TEST_OUTCOME" = success
