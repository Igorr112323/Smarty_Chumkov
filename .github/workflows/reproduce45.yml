name: Воспроизведение точки A

on:
  push:
    branches:
      - arena/5afadcb0-smarty-chumkov
    paths:
      - .github/workflows/reproduce45.yml

permissions:
  contents: write

jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        fold: [1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Dataset/1_rushallu_rag_gold
            spanver
            tools
            tests
            artifacts
            models/rubert-tiny2
            weights/rubert-tiny2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Установить исходные зависимости
        run: |
          set -euo pipefail
          pip install pyarrow
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers>=4.50,<5' huggingface_hub
      - name: Подготовить только train и val
        run: |
          set -euo pipefail
          python tools/prepare_ours33.py
          python tools/assemble_weights.py weights/rubert-tiny2 models/rubert-tiny2/pytorch_model.bin
      - name: Воспроизвести фолд без подбора
        run: python -u tools/reproduce45.py --fold '${{ matrix.fold }}' --git-sha '${{ github.sha }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproduce45-fold${{ matrix.fold }}
          path: artifacts/reproduce45_fold${{ matrix.fold }}.json
          if-no-files-found: warn
          retention-days: 30
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Dataset/1_rushallu_rag_gold
            spanver
            tools
            artifacts
            models/rubert-tiny2
            weights/rubert-tiny2
            weights/final
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Установить зависимости и подготовить данные
        run: |
          set -euo pipefail
          pip install pyarrow
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers>=4.50,<5' huggingface_hub
          python tools/prepare_ours33.py
          python tools/assemble_weights.py weights/rubert-tiny2 models/rubert-tiny2/pytorch_model.bin
      - name: Восстановить пять сидов и проверить инференс
        run: python -u tools/verify_final45.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproduce45-verification
          path: artifacts/final45_restore_verification.json
          if-no-files-found: warn
          retention-days: 30
  collect:
    if: always()
    needs: [reproduce, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: reproduce45-*
          path: artifacts
          merge-multiple: true
      - name: Сохранить результаты и неполные отчёты
        run: |
          set -euo pipefail
          python tools/collect_final45.py
          git add -f artifacts/final45_reproduction_summary.json
          for file in artifacts/reproduce45_fold*.json artifacts/final45_restore_verification.json; do
            if test -f "$file"; then git add -f "$file"; fi
          done
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! git diff --cached --quiet; then
            git commit -m 'Сохранить проверку точки A [skip ci]'
            git push origin HEAD:arena/5afadcb0-smarty-chumkov
          fi
