name: rubert-base CV

on:
  workflow_dispatch:
  push:
    branches:
      - arena/5afadcb0-smarty-chumkov
    paths:
      - .github/workflows/train_base.yml
      - scripts/download_rubert_base.py
      - tools/prepare_ours33.py
      - tools/train_base33.py
      - tools/train_cv_feat.py
      - tools/speed_bench.py
      - tools/speed_bench_batched.py
      - tools/summary_base33.py
      - weights/rubert-base-cased/curadoria/**

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_HUB_DOWNLOAD_TIMEOUT: "120"
      HF_HUB_DISABLE_XET: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Dataset/1_rushallu_rag_gold
            spanver
            tools
            scripts
            tests
            weights/rubert-base-cased/curadoria
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyarrow
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers>=4.50,<5' huggingface_hub
      - name: safety tests
        run: python -m pytest -q tests/test_base33_safe.py tests/test_base33_training.py tests/test_preflight_13.py tests/test_sweep_ragtruth30.py
      - name: prepare only train and validation
        run: python tools/prepare_ours33.py
      - name: download base weights
        run: python scripts/download_rubert_base.py
      - name: train CV
        id: train
        continue-on-error: true
        run: |
          timeout --signal=TERM --kill-after=30s 140m bash -c '
            set +e
            python tools/train_cv_feat.py --weights models/rubert-base-cased --gold artifacts/ours33.jsonl --ours-only --folds 3 --epochs 3 --loss focal2.0 --out artifacts/cv/base3 --report artifacts/cv_report_base3.json
            status=$?
            if [ "$status" -eq 75 ]; then
              cp artifacts/cv_report_base3.json artifacts/cv_report_base3_pilot.json
              echo "Прогноз не укладывается, запуск 2 полноценных фолдов."
              python tools/train_cv_feat.py --weights models/rubert-base-cased --gold artifacts/ours33.jsonl --ours-only --folds 2 --epochs 3 --loss focal2.0 --out artifacts/cv/base3 --report artifacts/cv_report_base3.json
              status=$?
            fi
            exit "$status"
          '
      - name: speed
        id: speed
        if: steps.train.outcome == 'success'
        continue-on-error: true
        run: python tools/speed_bench.py --weights models/rubert-base-cased
      - name: summary
        if: always()
        run: python tools/summary_base33.py
      - name: upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rubert-base-cv
          path: |
            artifacts/cv_report_base3.json
            artifacts/cv_report_base3_pilot.json
            artifacts/cv/base3/**
            artifacts/speed_report_base.json
            models/rubert-base-cased/manifest.json
          if-no-files-found: warn
      - name: verify completion
        if: always()
        env:
          TRAIN_OUTCOME: ${{ steps.train.outcome }}
          SPEED_OUTCOME: ${{ steps.speed.outcome }}
        run: |
          if [ "$TRAIN_OUTCOME" != success ] || [ "$SPEED_OUTCOME" != success ]; then
            echo "CV или замер скорости не завершены"
            exit 1
          fi
