name: Десятифолдовая проверка 51

on:
  push:
    branches:
      - arena/5afadcb0-smarty-chumkov
    paths:
      - artifacts/ablation51_ten_plan.json

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      variant: ${{ steps.plan.outputs.variant }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: artifacts
      - id: plan
        run: |
          set -euo pipefail
          variant=$(python -c "import json; x=json.load(open('artifacts/ablation51_ten_plan.json')); assert x['variant'] == 'ten'; assert x['seeds']==[0,1,2,3,4]; print(x['variant'])")
          echo "variant=$variant" >> "$GITHUB_OUTPUT"
  smoke:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            spanver
            tools
            tests
            scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          pip install pytest pyarrow
          pip install 'torch==2.15.0' --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers==4.57.6' huggingface_hub
          python -m pytest -q tests/test_base33_safe.py tests/test_base33_training.py tests/test_preflight_13.py tests/test_sweep_ragtruth30.py tests/test_nested36.py tests/test_nested37.py tests/test_nested38.py tests/test_train46.py tests/test_collect46.py tests/test_diagnose46.py tests/test_train47.py tests/test_collect47.py
  folds:
    needs: [plan, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - {outer: 1, inner: 2, primary: true}
          - {outer: 1, inner: 3, primary: false}
          - {outer: 1, inner: 4, primary: false}
          - {outer: 1, inner: 5, primary: false}
          - {outer: 2, inner: 3, primary: true}
          - {outer: 2, inner: 4, primary: false}
          - {outer: 2, inner: 5, primary: false}
          - {outer: 2, inner: 6, primary: false}
          - {outer: 3, inner: 4, primary: true}
          - {outer: 3, inner: 5, primary: false}
          - {outer: 3, inner: 6, primary: false}
          - {outer: 3, inner: 7, primary: false}
          - {outer: 4, inner: 5, primary: true}
          - {outer: 4, inner: 6, primary: false}
          - {outer: 4, inner: 7, primary: false}
          - {outer: 4, inner: 8, primary: false}
          - {outer: 5, inner: 6, primary: true}
          - {outer: 5, inner: 7, primary: false}
          - {outer: 5, inner: 8, primary: false}
          - {outer: 5, inner: 9, primary: false}
          - {outer: 6, inner: 7, primary: true}
          - {outer: 6, inner: 8, primary: false}
          - {outer: 6, inner: 9, primary: false}
          - {outer: 6, inner: 10, primary: false}
          - {outer: 7, inner: 8, primary: true}
          - {outer: 7, inner: 9, primary: false}
          - {outer: 7, inner: 10, primary: false}
          - {outer: 7, inner: 1, primary: false}
          - {outer: 8, inner: 9, primary: true}
          - {outer: 8, inner: 10, primary: false}
          - {outer: 8, inner: 1, primary: false}
          - {outer: 8, inner: 2, primary: false}
          - {outer: 9, inner: 10, primary: true}
          - {outer: 9, inner: 1, primary: false}
          - {outer: 9, inner: 2, primary: false}
          - {outer: 9, inner: 3, primary: false}
          - {outer: 10, inner: 1, primary: true}
          - {outer: 10, inner: 2, primary: false}
          - {outer: 10, inner: 3, primary: false}
          - {outer: 10, inner: 4, primary: false}
    env:
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Dataset/1_rushallu_rag_gold
            spanver
            tools
            artifacts
            models/rubert-tiny2
            weights/rubert-tiny2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Подготовить зависимости и данные
        run: |
          set -euo pipefail
          pip install pyarrow
          pip install 'torch==2.15.0' --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers==4.57.6' huggingface_hub
          python tools/prepare_ours33.py
          python tools/assemble_weights.py weights/rubert-tiny2 models/rubert-tiny2/pytorch_model.bin
      - name: Обучить без доступа к внешним меткам
        run: timeout --signal=TERM --kill-after=30s 220m python -u tools/train51_ten.py --variant '${{ needs.plan.outputs.variant }}' --outer '${{ matrix.outer }}' --inner '${{ matrix.inner }}' --git-sha '${{ github.sha }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report51-${{ needs.plan.outputs.variant }}-outer${{ matrix.outer }}-inner${{ matrix.inner }}
          path: artifacts/ablation51_${{ needs.plan.outputs.variant }}_outer${{ matrix.outer }}_inner${{ matrix.inner }}.json
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always() && matrix.primary
        with:
          name: weights51-${{ needs.plan.outputs.variant }}-outer${{ matrix.outer }}
          path: weights/ablation51/
          if-no-files-found: warn
          retention-days: 30
  collect:
    if: always() && needs.plan.result == 'success' && needs.smoke.result == 'success'
    needs: [plan, smoke, folds]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Dataset/1_rushallu_rag_gold
            spanver
            tools
            artifacts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          pip install pyarrow
          pip install 'torch==2.15.0' --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers==4.57.6' huggingface_hub
          python tools/prepare_ours33.py
      - uses: actions/download-artifact@v4
        with:
          pattern: report51-${{ needs.plan.outputs.variant }}-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: weights51-${{ needs.plan.outputs.variant }}-*
          path: weights/ablation51
          merge-multiple: true
      - name: Отбор по внутренним фолдам и точные метрики
        run: |
          set -euo pipefail
          python tools/collect51_ten.py --variant ten
          python tools/analysis51_ten.py
          git fetch origin arena/5afadcb0-smarty-chumkov
          git merge --ff-only origin/arena/5afadcb0-smarty-chumkov
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --sparse -f artifacts/ablation51_ten_outer*_inner*.json artifacts/ablation51_ten_summary.json artifacts/analysis51_ten.json
          git commit -m "Сохранить результаты 10-fold 51 [skip ci]"
          git push origin HEAD:arena/5afadcb0-smarty-chumkov
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collected-weights51-ten
          path: weights/ablation51/ten/
          if-no-files-found: warn
          retention-days: 30
