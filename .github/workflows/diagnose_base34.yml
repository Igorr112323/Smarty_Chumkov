name: Диагностика rubert-base без обучения

on:
  workflow_dispatch:
  push:
    branches:
      - arena/5afadcb0-smarty-chumkov
    paths:
      - .github/workflows/diagnose_base34.yml

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HF_HUB_DOWNLOAD_TIMEOUT: "120"
      HF_HUB_DISABLE_XET: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/5afadcb0-smarty-chumkov
          sparse-checkout: |
            Dataset/1_rushallu_rag_gold
            spanver
            tools
            scripts
            tests
            weights/rubert-base-cased/curadoria
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        id: install
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyarrow
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers>=4.50,<5' huggingface_hub
      - name: safety tests
        id: tests
        run: python -m pytest -q tests/test_base33_safe.py tests/test_base33_training.py tests/test_preflight_13.py tests/test_sweep_ragtruth30.py
      - name: prepare train and validation only
        id: prepare
        run: |
          mkdir -p artifacts
          git show HEAD:artifacts/actions33_cv_report_base3.json > artifacts/actions33_cv_report_base3.json
          git show HEAD:artifacts/actions33_weights_manifest.json > artifacts/actions33_weights_manifest.json
          python tools/prepare_ours33.py
      - name: download original checkpoint artifact
        id: original
        run: gh run download 43828152726 --name rubert-base-cv --dir /tmp/base34-original
      - name: download initial weights
        id: weights
        run: python scripts/download_rubert_base.py
      - name: inspect checkpoints and 20 pairs
        id: diagnostic
        run: python tools/diagnose_base34.py --original /tmp/base34-original
      - name: upload only JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rubert-base-diagnostic-json
          path: artifacts/base34_diagnostic.json
          if-no-files-found: warn
      - name: commit diagnostic result
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          PREPARE: ${{ steps.prepare.outcome }}
          ORIGINAL: ${{ steps.original.outcome }}
          WEIGHTS: ${{ steps.weights.outcome }}
          DIAGNOSTIC: ${{ steps.diagnostic.outcome }}
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = {name.lower(): os.environ.get(name, '') for name in ('INSTALL', 'TESTS', 'PREPARE', 'ORIGINAL', 'WEIGHTS', 'DIAGNOSTIC')}
          Path('artifacts/base34_actions_status.json').write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git fetch origin arena/5afadcb0-smarty-chumkov
          git merge --ff-only origin/arena/5afadcb0-smarty-chumkov
          git add --sparse -f artifacts/base34_actions_status.json
          if [ -f artifacts/base34_diagnostic.json ]; then git add --sparse -f artifacts/base34_diagnostic.json; fi
          if ! git diff --cached --quiet; then
            git config user.name github-actions
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m 'Сохранить диагностику rubert-base [skip ci]'
            git push origin arena/5afadcb0-smarty-chumkov
          fi
